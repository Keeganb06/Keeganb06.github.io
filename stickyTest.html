<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            height: 2000px;
            padding-top: 60px; /* Ensures space for the navbar */
        }
        #navbar {
            position: sticky;
            top: 0;
            background: #88af9595;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="navbar">Sticky Navbar</div>
    <div style="height: 1800px; background-color: lightgray;">
        Scroll Down to Test
    </div>
</body>
</html>
